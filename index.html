<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ReVale</title>
</head>
<body>
<script>
(async function(){
  const employeePortal=['mi.revale.app','app.revale.app'].includes(location.hostname);
  const portalTitle=employeePortal?'Mi ReVale':'ReVale Comercios';
  document.title=portalTitle;
  try{
    const r=await fetch(employeePortal?'/empleados/index.html':'/comercios/index.html',{cache:'no-store'});
    if(!r.ok) throw new Error('PORTAL_LOAD_FAILED');
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<main style="font-family:system-ui;padding:40px"><h1>'+portalTitle+'</h1><p>No pudimos cargar el portal. Intenta recargar la página.</p></main>';
  }
})();
</script>
</body>
</html>
