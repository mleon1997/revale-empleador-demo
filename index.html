<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ReVale Comercios</title>
</head>
<body>
<script>
(async function(){
  try{
    const r=await fetch('/comercios/index.html',{cache:'no-store'});
    if(!r.ok) throw new Error('PORTAL_LOAD_FAILED');
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<main style="font-family:system-ui;padding:40px"><h1>ReVale Comercios</h1><p>No pudimos cargar el portal. Intenta recargar la página.</p></main>';
  }
})();
</script>
</body>
</html>
